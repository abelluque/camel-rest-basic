# Permisos de namespace para el pipeline. El push al registro interno y
# pipelines-scc están en components/camel-rest/cluster-admin porque un
# controlador GitOps sin cluster-admin no puede crear esos RoleBinding.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-deployer
  labels:
    app.kubernetes.io/name: rest-gateway
    app.kubernetes.io/part-of: camel-rest-basic
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams", "imagestreams/layers"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-deployer
  labels:
    app.kubernetes.io/name: rest-gateway
    app.kubernetes.io/part-of: camel-rest-basic
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-deployer
subjects:
  - kind: ServiceAccount
    name: pipeline
