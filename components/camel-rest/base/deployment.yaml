apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-gateway
  labels:
    app.kubernetes.io/name: rest-gateway
    app.kubernetes.io/part-of: camel-rest-basic
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rest-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rest-gateway
        app.kubernetes.io/part-of: camel-rest-basic
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rest-gateway
          image: image-registry.openshift-image-registry.svc:5000/camel-rest/rest-gateway:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          env:
            - name: SPRING_APPLICATION_JSON
              value: '{"server":{"undertow":{"io-threads":1,"worker-threads":2}}}'
          startupProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
