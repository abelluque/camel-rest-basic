apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rest-gateway
  labels:
    app.kubernetes.io/name: rest-gateway
    app.kubernetes.io/part-of: camel-rest-basic
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  to:
    kind: Service
    name: rest-gateway
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
