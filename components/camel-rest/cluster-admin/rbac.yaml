# Buildah necesita pipelines-scc. El registro interno autoriza el push
# con system:image-builder. Los aplica un cluster-admin (oc apply -k o bootstrap).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-scc
  labels:
    app.kubernetes.io/name: rest-gateway
    app.kubernetes.io/part-of: camel-rest-basic
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pipelines-scc-clusterrole
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: camel-rest
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-image-builder
  labels:
    app.kubernetes.io/name: rest-gateway
    app.kubernetes.io/part-of: camel-rest-basic
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: camel-rest
