apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: camel-rest
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: camel-rest-basic
spec:
  project: default
  source:
    repoURL: https://github.com/abelluque/camel-rest-basic.git
    targetRevision: gitops-feature
    path: components/camel-rest/base
  destination:
    server: https://kubernetes.default.svc
    namespace: camel-rest
  ignoreDifferences:
    - group: tekton.dev
      kind: PipelineRun
      jsonPointers:
        - /metadata/labels/tekton.dev~1pipeline
        - /metadata/annotations/chains.tekton.dev~1signed
        - /metadata/annotations/results.tekton.dev~1record
        - /metadata/annotations/results.tekton.dev~1result
        - /metadata/annotations/results.tekton.dev~1stored
        - /spec/timeouts/pipeline
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
